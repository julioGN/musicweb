[server]
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
maxMessageSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#252620"
backgroundColor = "#f8f8f3"
secondaryBackgroundColor = "#efefe8"
textColor = "#252620"
font = "sans serif"

[logger]
level = "info"

[client]
caching = true
displayEnabled = true

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true

[mapbox]
# Add your Mapbox token here if needed
# token = ""

[deprecation]
showPyplotGlobalUse = false